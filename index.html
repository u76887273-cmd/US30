<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EUR/USD (30M & 4H)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow-text { text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        .glow-green { text-shadow: 0 0 12px rgba(16, 185, 129, 0.6); }
        .glow-red { text-shadow: 0 0 12px rgba(244, 63, 94, 0.6); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-8">

    <div class="max-w-5xl w-full">
        <!-- Header + Latest Run Time (H:M) + Current Price -->
        <div class="glass rounded-2xl p-5 mb-6 shadow-xl flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-center sm:text-left">
                <h1 class="text-4xl font-extrabold text-sky-400 glow-text tracking-tight">EUR/USD</h1>
            </div>

            <!-- Latest Run Time (H:M only) & Current Price -->
            <div class="flex items-center gap-8 py-2 sm:py-0 sm:px-4">
                <div class="text-center">
                    <p class="text-[11px] text-slate-400 uppercase tracking-wide">Latest Run</p>
                    <p id="time-val" class="text-xl font-mono font-semibold text-slate-200 mt-0.5">--:--</p>
                </div>
                <div class="text-center border-l border-slate-700 pl-8">
                    <p class="text-[11px] text-slate-400 uppercase tracking-wide">Current Price</p>
                    <p id="price-val" class="text-3xl font-mono font-bold text-white mt-0.5">--</p>
                </div>
            </div>
        </div>

        <!-- Dual Timeframe Grid (30M & 4H on One Screen) -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

            <!-- ================= 30-MINUTE (30M) ENGINE ================= -->
            <div class="glass rounded-2xl p-6 shadow-2xl space-y-6">
                <div class="flex items-center justify-between border-b border-slate-700 pb-4 gap-2">
                    <span class="px-3 py-1 bg-sky-500/20 border border-sky-500/40 text-sky-400 rounded-lg text-xs font-bold uppercase tracking-wider">
                        30-Minute (30M)
                    </span>
                    <div class="flex items-center gap-2">
                        <span id="meta-val-30m" class="text-xs font-mono text-slate-400">RSI: -- | Bias: --</span>
                        <span id="status-val-30m" class="hidden px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider"></span>
                    </div>
                </div>

                <!-- Signal Area -->
                <div class="text-center py-8 bg-slate-800/50 rounded-xl border border-slate-700">
                    <p class="text-xs text-slate-400 uppercase tracking-widest mb-2">30M Final AI Signal</p>
                    <h2 id="signal-val-30m" class="text-5xl font-extrabold tracking-tight text-white">WAIT</h2>
                </div>

                <!-- Trade Zones -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="bg-emerald-900/20 border border-emerald-800/50 rounded-xl p-4 text-center">
                        <p class="text-xs text-emerald-400 uppercase tracking-wider mb-1">Buy Limits</p>
                        <p id="buy-zone-30m" class="font-mono text-base font-semibold text-emerald-100">--</p>
                    </div>
                    <div class="bg-rose-900/20 border border-rose-800/50 rounded-xl p-4 text-center">
                        <p class="text-xs text-rose-400 uppercase tracking-wider mb-1">Sell Limits</p>
                        <p id="sell-zone-30m" class="font-mono text-base font-semibold text-rose-100">--</p>
                    </div>
                </div>

                <!-- Equilibrium Target (TP) -->
                <div class="text-center pt-4 border-t border-slate-700">
                    <p class="text-xs text-sky-400 uppercase tracking-wider mb-3">30M Equilibrium Target (TP)</p>
                    <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700 shadow-inner">
                        <p id="tp-val-30m" class="font-mono text-3xl font-extrabold text-sky-400 glow-text">--</p>
                    </div>
                </div>
            </div>

            <!-- ================= 4-HOUR (4H) ENGINE ================= -->
            <div class="glass rounded-2xl p-6 shadow-2xl space-y-6">
                <div class="flex items-center justify-between border-b border-slate-700 pb-4 gap-2">
                    <span class="px-3 py-1 bg-purple-500/20 border border-purple-500/40 text-purple-300 rounded-lg text-xs font-bold uppercase tracking-wider">
                        4-Hour (4H)
                    </span>
                    <div class="flex items-center gap-2">
                        <span id="meta-val-4h" class="text-xs font-mono text-slate-400">RSI: -- | Bias: --</span>
                        <span id="status-val-4h" class="hidden px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider"></span>
                    </div>
                </div>

                <!-- Signal Area -->
                <div class="text-center py-8 bg-slate-800/50 rounded-xl border border-slate-700">
                    <p class="text-xs text-slate-400 uppercase tracking-widest mb-2">4H Final AI Signal</p>
                    <h2 id="signal-val-4h" class="text-5xl font-extrabold tracking-tight text-white">WAIT</h2>
                </div>

                <!-- Trade Zones -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="bg-emerald-900/20 border border-emerald-800/50 rounded-xl p-4 text-center">
                        <p class="text-xs text-emerald-400 uppercase tracking-wider mb-1">Buy Limits</p>
                        <p id="buy-zone-4h" class="font-mono text-base font-semibold text-emerald-100">--</p>
                    </div>
                    <div class="bg-rose-900/20 border border-rose-800/50 rounded-xl p-4 text-center">
                        <p class="text-xs text-rose-400 uppercase tracking-wider mb-1">Sell Limits</p>
                        <p id="sell-zone-4h" class="font-mono text-base font-semibold text-rose-100">--</p>
                    </div>
                </div>

                <!-- Equilibrium Target (TP) -->
                <div class="text-center pt-4 border-t border-slate-700">
                    <p class="text-xs text-sky-400 uppercase tracking-wider mb-3">4H Equilibrium Target (TP)</p>
                    <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700 shadow-inner">
                        <p id="tp-val-4h" class="font-mono text-3xl font-extrabold text-sky-400 glow-text">--</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- Buttons Area -->
        <div class="flex flex-col sm:flex-row justify-center gap-4 mt-8">
            <button id="refresh-btn" onclick="fetchData(true)" class="px-6 py-3 bg-sky-600 hover:bg-sky-500 text-white rounded-full font-semibold transition-colors shadow-[0_0_15px_rgba(2,132,199,0.5)]">
                Refresh Data
            </button>

            <!-- FORCE RUN BUTTON -->
            <button id="force-btn" onclick="forceRun()" class="px-6 py-3 bg-amber-600 hover:bg-amber-500 text-white rounded-full font-semibold transition-colors shadow-[0_0_15px_rgba(217,119,6,0.5)] flex items-center justify-center gap-2">
                <span>⚡ Force Engine Run</span>
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://nabjqvmgytcnlezyxnly.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hYmpxdm1neXRjbmxlenl4bmx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MDg1MzcsImV4cCI6MjEwNjQ4NDUzN30.HRR0_Yu6xIUE7DAdqvPJlUOu37Gkz8xX6g4rsIVN98I";

        const GITHUB_USERNAME = window.location.hostname.includes("github.io") 
            ? window.location.hostname.split(".")[0] 
            : "u76887273-cmd"; 

        // Safely detect GitHub repo name without accidentally grabbing "index.html"
        const pathSegment = window.location.pathname.split("/")[1] || "";
        const GITHUB_REPO = (pathSegment && !pathSegment.endsWith(".html"))
            ? pathSegment
            : "eurusd_30M_4H";

        let latestKnownRunIso = null;

        // Format any EUR/USD price number in a string to 4 decimals
        function formatPricesTo4Decimals(str) {
            if (!str) return "--";
            return str.replace(/\b(\d+\.\d{3,6})\b/g, (match) => Number(match).toFixed(4));
        }

        function renderTimeframeCard(tf, row) {
            const sigEl = document.getElementById(`signal-val-${tf}`);
            const signal = (row.signal || "WAIT").toUpperCase();
            sigEl.innerText = signal;

            if (signal === "BUY") {
                sigEl.className = "text-5xl font-extrabold tracking-tight text-emerald-400 glow-green";
            } else if (signal === "SELL") {
                sigEl.className = "text-5xl font-extrabold tracking-tight text-rose-400 glow-red";
            } else {
                sigEl.className = "text-5xl font-extrabold tracking-tight text-slate-300";
            }

            const rawReason = row.reason || "";
            const eqMatch = rawReason.match(/EQ:\s*([0-9.]+)/i);
            const rsiMatch = rawReason.match(/RSI:\s*([0-9.]+)/i);
            const biasMatch = rawReason.match(/Bias:\s*([0-9.]+%?)/i);

            const rsiText = rsiMatch ? Number(rsiMatch[1]).toFixed(1) : "--";
            const biasText = biasMatch ? (biasMatch[1].endsWith("%") ? biasMatch[1] : `${biasMatch[1]}%`) : "--";
            document.getElementById(`meta-val-${tf}`).innerText = `RSI: ${rsiText} | Bias: ${biasText}`;

            // Render HIT_TP or ACTIVE badge
            const statusEl = document.getElementById(`status-val-${tf}`);
            if (row.status === "HIT_TP") {
                statusEl.innerText = "HIT TP ✓";
                statusEl.className = "px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-emerald-500/20 border border-emerald-500/40 text-emerald-300";
            } else if (signal === "BUY" || signal === "SELL") {
                statusEl.innerText = "ACTIVE";
                statusEl.className = "px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-amber-500/20 border border-amber-500/40 text-amber-300";
            } else {
                statusEl.className = "hidden";
            }

            const eqValue = (row.take_profit !== null && row.take_profit !== undefined)
                ? Number(row.take_profit)
                : (eqMatch ? Number(eqMatch[1]) : null);
            const eqFormatted = (eqValue !== null && !Number.isNaN(eqValue)) ? eqValue.toFixed(4) : "--";

            const zoneText = formatPricesTo4Decimals(row.entry_zone || "-");
            if (zoneText.includes("|")) {
                const parts = zoneText.split("|");
                document.getElementById(`buy-zone-${tf}`).innerText = parts[0].replace("B:", "").trim();
                document.getElementById(`sell-zone-${tf}`).innerText = parts[1].replace("S:", "").trim();
            } else if (signal === "BUY") {
                document.getElementById(`buy-zone-${tf}`).innerText = zoneText;
                document.getElementById(`sell-zone-${tf}`).innerText = "WAITING";
            } else if (signal === "SELL") {
                document.getElementById(`buy-zone-${tf}`).innerText = "WAITING";
                document.getElementById(`sell-zone-${tf}`).innerText = zoneText;
            } else {
                document.getElementById(`buy-zone-${tf}`).innerText = zoneText;
                document.getElementById(`sell-zone-${tf}`).innerText = zoneText;
            }

            document.getElementById(`tp-val-${tf}`).innerText = eqFormatted;
        }

        async function fetchTableLatest(tableName) {
            const url = `${SUPABASE_URL}/rest/v1/${tableName}?select=*&order=id.desc&limit=1`;
            const response = await fetch(url, {
                cache: 'no-store',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                }
            });
            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`HTTP ${response.status}: ${errText}`);
            }
            return await response.json();
        }

        async function fetchData(isManual = false) {
            const refreshBtn = document.getElementById("refresh-btn");
            if (isManual && refreshBtn) {
                refreshBtn.innerText = "Refreshing...";
            }

            try {
                const [res30m, res4h] = await Promise.allSettled([
                    fetchTableLatest("eurusd_grid_log_30m"),
                    fetchTableLatest("eurusd_grid_log_4h")
                ]);

                const data30m = res30m.status === "fulfilled" ? res30m.value : [];
                const data4h = res4h.status === "fulfilled" ? res4h.value : [];

                const row30 = data30m && data30m.length > 0 ? data30m[0] : null;
                const row4h = data4h && data4h.length > 0 ? data4h[0] : null;

                const headerRow = row30 || row4h;
                if (headerRow) {
                    const rawTs = headerRow.created_at || headerRow.timestamp;
                    latestKnownRunIso = rawTs;
                    const runTime = new Date(rawTs);
                    document.getElementById('time-val').innerText = runTime.toLocaleTimeString([], {
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: false
                    });
                    document.getElementById('price-val').innerText = Number(headerRow.price).toFixed(4);
                }

                if (row30) renderTimeframeCard("30m", row30);
                if (row4h) renderTimeframeCard("4h", row4h);
            } catch (error) {
                console.error("Supabase Error:", error);
            } finally {
                if (isManual && refreshBtn) {
                    setTimeout(() => { refreshBtn.innerText = "Refresh Data"; }, 400);
                }
            }
        }

        async function forceRun() {
            let token = localStorage.getItem("github_pat_eurusd") || localStorage.getItem("github_pat_us30") || localStorage.getItem("github_pat");
            
            if (!token) {
                token = prompt("🔒 FIRST TIME SETUP:\n\nPlease paste your GitHub Token (ghp_... or github_pat_...) here:");
                if (!token) return; 
                token = token.trim();
                localStorage.setItem("github_pat_eurusd", token); 
            }

            const btn = document.getElementById("force-btn");
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = "<span>⏳ Triggering...</span>";

            try {
                // Checks pipeline.yml first (matching your renamed workflow file), then fallbacks
                const workflows = ["pipeline.yml", "run-pipeline.yml", "main.yml"];
                let response = null;

                for (const wf of workflows) {
                    response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/actions/workflows/${wf}/dispatches`, {
                        method: "POST",
                        headers: {
                            "Accept": "application/vnd.github+json",
                            "Authorization": `Bearer ${token}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ ref: "main" }) 
                    });
                    if (response.status !== 404) break;
                }

                if (response && (response.ok || response.status === 204)) {
                    const prevRunIso = latestKnownRunIso;
                    let remaining = 35;

                    const pollTimer = setInterval(async () => {
                        remaining -= 5;
                        btn.innerHTML = `<span>⏳ Running Engine (${Math.max(remaining, 0)}s)...</span>`;
                        await fetchData(false);

                        if ((latestKnownRunIso && latestKnownRunIso !== prevRunIso) || remaining <= 0) {
                            clearInterval(pollTimer);
                            btn.innerHTML = "<span>✅ Updated!</span>";
                            btn.disabled = false;
                            setTimeout(() => { btn.innerHTML = originalText; }, 2500);
                        }
                    }, 5000);
                } else {
                    const errData = response ? await response.json().catch(() => ({})) : { message: "Workflow not found" };
                    if (response && (response.status === 401 || response.status === 403)) {
                        localStorage.removeItem("github_pat");
                        localStorage.removeItem("github_pat_us30");
                        localStorage.removeItem("github_pat_eurusd");
                        alert(`❌ Token unauthorized or expired for ${GITHUB_USERNAME}/${GITHUB_REPO}. Cleared from memory—click again to enter a new token.`);
                    } else if (response && response.status === 404) {
                        alert(`❌ Workflow file or repository (${GITHUB_USERNAME}/${GITHUB_REPO}) not found (HTTP 404). Make sure your token has 'repo' and 'workflow' permissions.`);
                    } else {
                        alert("Error: " + (errData.message || "Failed to trigger workflow."));
                    }
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                alert("Network error. Could not reach GitHub API.");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        fetchData();
        setInterval(() => fetchData(false), 30000);
    </script>
</body>
</html>
