name: US30 Quantum Dual Engine (30M & 4H)

on:
  schedule:
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force retrain AI models even if already trained today?'
        required: false
        default: 'false'

concurrency:
  group: us30-quantum-pipeline
  cancel-in-progress: false

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
      SYMBOL_ID: ${{ secrets.SYMBOL_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Normalize Script Filenames & Locations
        run: |
          echo "=== Files currently in repository ==="
          find . -maxdepth 3 -not -path '*/.*'
          # Normalize case/location if mobile keyboard capitalized filenames (e.g., Data.py -> data.py)
          for script in data.py train.py predict.py validator.py requirements.txt; do
            found=$(find . -maxdepth 3 -iname "$script" | head -n 1)
            if [ -n "$found" ] && [ "$found" != "./$script" ]; then
              echo "Moving $found -> ./$script"
              cp "$found" "./$script"
            fi
          done

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy scikit-learn joblib "psycopg[binary]" ctrader-open-api twisted service_identity pyOpenSSL
          fi

      - name: 🕒 Get Current UTC Date for Daily Model Cache
        id: get-date
        run: echo "DATE_UTC=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: 💾 Restore Daily AI Models (30M & 4H)
        id: model-cache
        uses: actions/cache@v4
        with:
          path: |
            model_30m.pkl
            model_4h.pkl
          key: us30-models-9feat-${{ steps.get-date.outputs.DATE_UTC }}

      - name: 📡 Step 1 - Fetch Latest Closed M5 Bars (data.py)
        run: python data.py

      - name: 🧠 Step 2 - Train Models Once Per Day (train.py)
        if: steps.model-cache.outputs.cache-hit != 'true' || github.event.inputs.force_retrain == 'true'
        run: |
          echo "🔄 First run of UTC day (${{ steps.get-date.outputs.DATE_UTC }}) or forced retrain. Training 30M & 4H models..."
          python train.py

      - name: 🎯 Step 3 - Run 30M & 4H Predictions (predict.py)
        run: python predict.py

      - name: ✅ Step 4 - Validate Active Signals Against TP (validator.py)
        run: python validator.py
