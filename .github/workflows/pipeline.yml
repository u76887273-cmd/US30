name: US30 Quantum Live Engine (30M and 4H)

on:
  schedule:
    # 1. Sunday 21:00–23:45 UTC (Reopen window + DST buffer)
    - cron: '*/15 21-23 * * 0'
    # 2. Monday through Thursday (All day, every 15 mins)
    - cron: '*/15 * * * 1-4'
    # 3. Friday 00:00–22:45 UTC (Stops after Friday close for the entire weekend)
    - cron: '*/15 0-22 * * 5'
  workflow_dispatch:
    inputs:
      force_train:
        description: 'Force AI model retraining (true/false)'
        required: false
        default: 'false'

concurrency:
  group: us30-quantum-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONPATH: .:./src
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL || vars.DATABASE_URL }}
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID || secrets.CLIENT_ID || vars.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET || secrets.CLIENT_SECRET || vars.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN || secrets.ACCESS_TOKEN || vars.CTRADER_ACCESS_TOKEN }}
      ACCOUNT_ID: ${{ secrets.ACCOUNT_ID || secrets.CTRADER_ACCOUNT_ID || secrets.CTID_TRADER_ACCOUNT_ID || vars.ACCOUNT_ID }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID || secrets.ACCOUNT_ID || secrets.CTID_TRADER_ACCOUNT_ID || vars.CTRADER_ACCOUNT_ID }}
      SYMBOL_ID: ${{ secrets.SYMBOL_ID || secrets.CTRADER_SYMBOL_ID || vars.SYMBOL_ID || '1287' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Root and src Script Locations
        run: |
          mkdir -p src
          for script in data.py train.py predict.py; do
            if [ -f "$script" ] && [ -f "src/$script" ]; then
              if [ "$script" -nt "src/$script" ]; then
                cp "$script" "src/$script"
              else
                cp "src/$script" "$script"
              fi
            elif [ -f "$script" ] && [ ! -f "src/$script" ]; then
              cp "$script" "src/$script"
            elif [ -f "src/$script" ] && [ ! -f "$script" ]; then
              cp "src/$script" "$script"
            fi
          done

      - name: Set up Python 3.11 (No Cache Egress)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          if [ -f "requirements.txt" ]; then
            pip install --no-cache-dir -r requirements.txt
          else
            pip install --no-cache-dir "psycopg[binary]==3.1.18" ctrader-open-api==0.9.2 pandas numpy scikit-learn joblib twisted service_identity pyOpenSSL
          fi

      - name: 1. Fetch Live Market Data and Spot Price (cTrader)
        run: python src/data.py

      - name: 2. Daily AI Model Retraining (Once Per Day or Forced)
        run: |
          TODAY_UTC=$(date -u +'%Y-%m-%d')
          FORCE_TRAIN=$(echo "${{ github.event.inputs.force_train }}" | tr '[:upper:]' '[:lower:]')
          LAST_TRAINED=""
          if [ -f .last_trained_date ]; then
            LAST_TRAINED=$(cat .last_trained_date | tr -d '[:space:]')
          elif [ -f last_trained.txt ]; then
            LAST_TRAINED=$(cut -c 1-10 last_trained.txt)
          fi

          if [ "$FORCE_TRAIN" = "true" ]; then
            echo "FORCING model retrain: Removing local models..."
            rm -f *.pkl .last_trained_date last_trained.txt
          fi

          if [ "$LAST_TRAINED" != "$TODAY_UTC" ] || [ ! -f "model_30m.pkl" ] || [ ! -f "model_4h.pkl" ]; then
            echo "🔄 Running Daily US30 AI Model Training for UTC date $TODAY_UTC..."
            python src/train.py
            echo "$TODAY_UTC" > .last_trained_date
            date -u +'%Y-%m-%dT%H:%M:%SZ' > last_trained.txt

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f model_30m.pkl model_4h.pkl .last_trained_date last_trained.txt
            git commit -m "chore: daily US30 model update ($TODAY_UTC) [skip ci]" || true
            git push origin HEAD:main || true
          else
            echo "⚡ Skipping training! US30 models already trained today ($TODAY_UTC)."
          fi

      - name: 3. Run AI Prediction Engine
        run: python src/predict.py
