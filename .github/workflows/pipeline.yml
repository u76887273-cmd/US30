name: US30 Quantum Live Engine

on:
  schedule:
    # 1. Sunday 21:00–23:45 UTC (Includes 1-hour safety buffer for November Winter Time)
    - cron: '*/15 21-23 * * 0'
    # 2. Monday through Thursday (All day, every 15 mins)
    - cron: '*/15 * * * 1-4'
    # 3. Friday 00:00–22:45 UTC (Includes 1-hour safety buffer for November Winter Time)
    - cron: '*/15 0-22 * * 5'
  workflow_dispatch:
    inputs:
      force_train:
        description: 'Force AI model retraining?'
        required: false
        default: 'false'

concurrency:
  group: us30-quantum-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:./src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      SYMBOL_ID: ${{ secrets.SYMBOL_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install "psycopg[binary]==3.1.18" ctrader-open-api==0.9.2 pandas numpy scikit-learn joblib twisted service_identity
          fi

      - name: Get Current UTC Date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Restore Today's Trained AI Models from Cache
        uses: actions/cache@v4
        with:
          path: |
            *.pkl
            models/*.pkl
            last_trained.txt
            models/last_trained.txt
          key: us30-models-v3-Linux-${{ env.date }}-${{ github.run_id }}
          restore-keys: |
            us30-models-v3-Linux-${{ env.date }}-

      - name: 1. Fetch Live Market Data & Spot Price (cTrader)
        run: python src/data.py

      - name: 2. Daily AI Model Retraining (Once Per Day or Forced)
        run: |
          CURRENT_HOUR=$(date -u +%H)
          FORCE_TRAIN=$(echo "${{ github.event.inputs.force_train }}" | tr '[:upper:]' '[:lower:]')
          
          if [ "$FORCE_TRAIN" = "true" ]; then
            echo "FORCING model retrain: Removing local models..."
            rm -f *.pkl models/*.pkl last_trained.txt models/last_trained.txt
          fi

          if [ ! -f "model_30m.pkl" ] || [ ! -f "model_4h.pkl" ] || [ "$CURRENT_HOUR" = "00" ]; then
            echo "🔄 Running Daily US30 AI Model Training on Full Historical Dataset..."
            python src/train.py
            date -u +'%Y-%m-%dT%H:%M:%SZ' > last_trained.txt
          else
            echo "⚡ Skipping training! Using cached AI models for fast prediction."
          fi

      - name: 3. Run AI Prediction Engine
        run: python src/predict.py

      - name: 4. Run Grid State Validator
        run: python src/validator.py
