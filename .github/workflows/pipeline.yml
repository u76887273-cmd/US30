name: US30 Quantum Live Engine

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      ACCOUNT_ID: "25145646"
      SYMBOL_ID: "1287"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: 1. Fetch Live Market Data (cTrader)
        run: python src/data.py

      - name: 2. Daily AI Model Retraining (Once Per Day)
        run: python src/train.py

      - name: 3. Run AI Prediction Engine
        run: python src/predict.py

      - name: 4. Run Grid State Validator
        run: python src/validator.py
      - name: 5. Run 4H Database Backtest Report
        run: python src/backtest_4h.py
